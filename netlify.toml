[build]
  # Salin src/cart.js ke public/src/ agar bisa diakses browser saat deploy
  command = "cp -r src public/src"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404

